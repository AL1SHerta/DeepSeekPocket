org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# 首次排查阶段关闭配置缓存，M0 通过后再开启
# org.gradle.configuration-cache=true

# 网络超时（避免依赖下载无限挂起）
systemProp.org.gradle.internal.http.connectionTimeout=30000
systemProp.org.gradle.internal.http.socketTimeout=60000

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 内置 Kotlin 默认禁止 kotlin.sourceSets DSL，而 KSP 仍用它注册生成目录。
# 允许后 KSP 生成的 Kotlin 源码才能进入编译。详见 developer.android.com/r/tools/built-in-kotlin
android.disallowKotlinSourceSets=false

kotlin.code.style=official
